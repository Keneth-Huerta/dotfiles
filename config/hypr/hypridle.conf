# ~/.config/hypr/hypridle.conf
# Configuración de gestión de energía e inactividad para Hyprland
# SUSPENSIÓN DE PANTALLA DESHABILITADA - sin atenuación, sin DPMS off, sin suspend

general {
    # lock_cmd = pidof hyprlock || hyprlock       # comando para bloquear deshabilitado
    # before_sleep_cmd = loginctl lock-session    # bloquear antes de suspender deshabilitado
    after_sleep_cmd = hyprctl dispatch dpms on  # encender pantalla al despertar
    ignore_dbus_inhibit = false                 # respetar inhibidores de aplicaciones
}

